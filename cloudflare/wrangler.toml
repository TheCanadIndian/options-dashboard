name = "options-scan-trigger"
main = "worker.js"
compatibility_date = "2026-10-01"

# UTC, Monday to Friday (Cloudflare numbers days from 1 = Sunday, so use names, not 1-5).
# Covers 9:30-16:00 New York in both daylight and standard time. The Worker drops the
# firings outside market hours.
[triggers]
crons = ["*/15 13-21 * * MON-FRI"]

[vars]
REPO = "TheCanadIndian/options-dashboard"

[[r2_buckets]]
binding = "STATE"
bucket_name = "options-dashboard-state"
