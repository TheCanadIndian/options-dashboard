name: Research

# Long-term research for the Invest page, after each weekday's close. Company reports are cached
# for a week, so most runs only refresh prices. Shares the scan's queue so the two never touch
# the state at the same time.
on:
  schedule:
    - cron: "15 21 * * 1-5"  # 17:15 New York in daylight time, 16:15 in standard time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Toronto
      STATE_URL: ${{ vars.STATE_URL }}
      STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pull state
        id: pull
        run: uv run python -m options_dashboard.cloudstate pull
      - name: Backfill new methods into the journal
        run: uv run python -m options_dashboard.backfill
      - name: Research
        run: |
          git config user.name "options-scanner"
          git config user.email "options-scanner@users.noreply.github.com"
          uv run python -m options_dashboard.longterm --publish
      - name: Push state
        if: always() && steps.pull.outcome == 'success'
        run: uv run python -m options_dashboard.cloudstate push
